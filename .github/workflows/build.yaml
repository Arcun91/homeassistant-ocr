name: Build and Publish Add-on Images

on:
  push:
    branches:
      - main
    paths:
      - "ocr_web_tool/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' ocr_web_tool/config.yaml | cut -d '"' -f 2)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ocr_web_tool
          file: ./ocr_web_tool/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/arcun91/ocr_web_tool_${{ matrix.arch }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/arcun91/ocr_web_tool_${{ matrix.arch }}:latest
          labels: |
            io.hass.version=${{ steps.version.outputs.VERSION }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.name=OCR Web Tool
